apiVersion: v1
kind: ConfigMap
metadata:
  name: gluetun-common-env
  namespace: {{ .Values.global.namespace }}
data:
  VPN_SERVICE_PROVIDER: "{{ .Values.global.vpn.provider }}"
  VPN_TYPE: "{{ .Values.global.vpn.type }}"
  SERVER_REGIONS: "{{ .Values.global.vpn.region }}"
  TZ: "{{ .Values.global.tz }}"
  FIREWALL: "on"
  FIREWALL_OUTBOUND_SUBNETS: "{{ .Values.global.vpn.outboundSubnets }}"
  FIREWALL_DEBUG: "on"
  {{- /* Build a comma-separated list of all app ports for input allowlist */}}
  {{- $ports := list -}}
  {{- range .Values.apps }}
  {{- $ports = append $ports (toString .port) -}}
  {{- end }}
  FIREWALL_INPUT_PORTS: "{{ join "," $ports }}"
  DOT: "off"
  DNS_ADDRESS: "{{ .Values.global.vpn.dns }}"
  HEALTH_SERVER_ADDRESS: ":9999"
