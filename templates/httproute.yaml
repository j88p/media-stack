{{- range .Values.apps }}
---
{{- if .ingressHost }}
{{- if eq $.Values.global.routing.type "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-local
  namespace: {{ $.Values.global.namespace }}
spec:
  hostnames:
    - {{ .ingressHost }}
  parentRefs:
    - name: {{ $.Values.global.routing.gateway.name }}
      namespace: {{ $.Values.global.routing.gateway.namespace }}
      sectionName: {{ $.Values.global.routing.gateway.section }}
  rules:
    - backendRefs:
        - name: {{ .name }}-service
          port: {{ .servicePort | default .port }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-ingress
  namespace: {{ $.Values.global.namespace }}
spec:
  ingressClassName: {{ $.Values.global.routing.ingressClass | default "nginx" }}
  rules:
    - host: {{ .ingressHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}-service
                port:
                  number: {{ .servicePort | default .port }}
{{- end }}
{{- end }}
{{- end }}
