{{- range .Values.apps }}
---
{{- if .ingressHost }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-local
  namespace: {{ $.Values.global.namespace }}
spec:
  hostnames:
    - {{ .ingressHost }}
  parentRefs:
    - name: {{ $.Values.global.gateway.name }}
      namespace: {{ $.Values.global.gateway.namespace }}
      sectionName: {{ $.Values.global.gateway.section }}
  rules:
    - backendRefs:
        - name: {{ .name }}-service
          port: {{ .servicePort | default .port }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- end }}
