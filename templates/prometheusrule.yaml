apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media-stack-alerts
  namespace: {{ .Values.global.namespace }}
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: media-stack
      interval: 1m
      rules:
        - alert: MediaAppDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace="{{ .Values.global.namespace }}"
            } == 0
          for: 5m
          labels:
            severity: critical
            namespace: {{ .Values.global.namespace }}
          annotations:
            summary: "{{ "{{" }} $labels.deployment {{ "}}" }} is down"
            description: "{{ "{{" }} $labels.deployment {{ "}}" }} has had 0 available replicas for 5 minutes."

        - alert: MediaAppCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="{{ .Values.global.namespace }}"
            }[15m]) > 5
          for: 0m
          labels:
            severity: critical
            namespace: {{ .Values.global.namespace }}
          annotations:
            summary: "{{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
            description: "{{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.container {{ "}}" }}) restarted {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} times in 15 minutes."
