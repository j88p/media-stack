{{- range .Values.apps }}
{{- $app := . }}
{{- if .ingresses }}
  {{- range $ing := .ingresses }}
---
{{- $host := (default $ing.host $ing.ingressHost) }}
{{- if $host }}
{{- $tlsEnabled := or $.Values.global.tls.enabled $app.enableTls $ing.enableTls }}
{{- $issuerName := (coalesce $ing.tlsIssuerName $app.tlsIssuerName $.Values.global.tls.issuerName) }}
{{- $issuerKind := (coalesce $ing.tlsIssuerKind $app.tlsIssuerKind $.Values.global.tls.issuerKind) | default "cluster-issuer" }}
{{- $secretName := (coalesce $ing.tlsSecretName $app.tlsSecretName $.Values.global.tls.defaultSecretName) | default (printf "%s-tls" $app.name) }}
{{- $hostSlug := (replace $host "." "-") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $app.name }}-{{ $hostSlug }}-ingress
  namespace: {{ $.Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- if $.Values.global.ingressClass }}
    kubernetes.io/ingress.class: {{ $.Values.global.ingressClass | quote }}
    {{- end }}
    {{- if and $tlsEnabled $issuerName }}
    cert-manager.io/{{ $issuerKind }}: {{ $issuerName | quote }}
    {{- end }}
spec:
  {{- if $.Values.global.ingressClass }}
  ingressClassName: {{ $.Values.global.ingressClass }}
  {{- else }}
  ingressClassName: nginx
  {{- end }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ $secretName }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $app.name }}-service
                port:
                  number: {{ $app.servicePort | default $app.port }}
{{- end }}
  {{- end }}
{{- else if .ingressHost }}
---
{{- $tlsEnabled := or $.Values.global.tls.enabled .enableTls }}
{{- $issuerName := (default $.Values.global.tls.issuerName .tlsIssuerName) }}
{{- $issuerKind := (default $.Values.global.tls.issuerKind .tlsIssuerKind) | default "cluster-issuer" }}
{{- $secretName := (or .tlsSecretName $.Values.global.tls.defaultSecretName) | default (printf "%s-tls" .name) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-local-ingress
  namespace: {{ $.Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- if $.Values.global.ingressClass }}
    kubernetes.io/ingress.class: {{ $.Values.global.ingressClass | quote }}
    {{- end }}
    {{- if and $tlsEnabled $issuerName }}
    cert-manager.io/{{ $issuerKind }}: {{ $issuerName | quote }}
    {{- end }}
spec:
  {{- if $.Values.global.ingressClass }}
  ingressClassName: {{ $.Values.global.ingressClass }}
  {{- else }}
  ingressClassName: nginx
  {{- end }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ .ingressHost }}
      secretName: {{ $secretName }}
  {{- end }}
  rules:
    - host: {{ .ingressHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}-service
                port:
                  number: {{ .servicePort | default .port }}
{{- end }}
{{- end }}
