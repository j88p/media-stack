{{- range .Values.apps }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}-netpol
  namespace: {{ $.Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from nginx ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
    # Allow from within the plex namespace (pod-to-pod, e.g. sonarr -> qbittorrent)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.global.namespace }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow all other outbound (VPN tunnel, external APIs, internal services)
    - {}
{{- end }}
