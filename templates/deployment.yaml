{{- range .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/name: {{ .name }}
    vpn-access: {{ if eq .name "plex" }}none{{ else }}required{{ end }}
spec:
  replicas: 1
  {{- if eq .name "plex" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        app.kubernetes.io/name: {{ .name }}
        vpn-access: {{ if eq .name "plex" }}none{{ else }}required{{ end }}
    spec:
      {{- if eq .name "plex" }}
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        containers:
          - name: plex
            image: "{{ $.Values.global.media.imageRepo }}/plex:{{ .imageTag | default "latest" }}"
            ports:
              - containerPort: 32400
                protocol: TCP
            livenessProbe:
              tcpSocket:
                port: 32400
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 5
            readinessProbe:
              tcpSocket:
                port: 32400
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
            envFrom:
              - configMapRef:
                  name: media-common-env
            env:
              - name: PUID
                value: "{{ $.Values.global.puid }}"
              - name: PGID
                value: "{{ $.Values.global.pgid }}"
              - name: VERSION
                value: "docker"
              - name: ADVERTISE_IP
                value: "{{ .env.ADVERTISE_IP }}"
            resources:
              {{- toYaml $.Values.resources.plex | nindent 14 }}
            securityContext:
              privileged: true
              runAsUser: 1000
              runAsGroup: 1000
            volumeMounts:
              - name: plex-config
                mountPath: /config
              - name: transcode
                mountPath: /transcode
              - name: movies
                mountPath: /movies
              - name: barnfilmer
                mountPath: /barnfilmer
              - name: tvshows
                mountPath: /tvshows
              - name: barnserier
                mountPath: /barnserier
        volumes:
          - name: plex-config
            hostPath:
              path: {{ .volumes.config }}
          - name: transcode
            hostPath:
              path: {{ .volumes.transcode }}
          - name: movies
            hostPath:
              path: {{ .volumes.movies }}
          - name: barnfilmer
            hostPath:
              path: {{ .volumes.barnfilmer }}
          - name: tvshows
            hostPath:
              path: {{ .volumes.tvshows }}
          - name: barnserier
            hostPath:
              path: {{ .volumes.barnserier }}
      {{- else if .noVpn }}
        containers:
          - name: {{ .name }}
            image: "{{ .imageRepo | default $.Values.global.media.imageRepo }}/{{ .name }}:{{ .imageTag | default "latest" }}"
            ports:
              - containerPort: {{ .port }}
            envFrom:
              - configMapRef:
                  name: media-common-env
            resources:
              {{- toYaml $.Values.resources.media | nindent 14 }}
            livenessProbe:
              tcpSocket:
                port: {{ .port }}
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
            readinessProbe:
              tcpSocket:
                port: {{ .port }}
              initialDelaySeconds: 30
              periodSeconds: 20
              timeoutSeconds: 10
              failureThreshold: 5
            volumeMounts:
              - name: {{ .name }}-config
                mountPath: {{ .configMountPath | default "/config" }}
        volumes:
          - name: {{ .name }}-config
            hostPath:
              {{- if .configHostPath }}
              path: {{ .configHostPath }}
              {{- else }}
              path: {{ $.Values.global.media.basePath }}/{{ .name }}
              {{- end }}
              type: DirectoryOrCreate
      {{- else }}
        containers:
          - name: gluetun
            image: {{ $.Values.global.vpn.image }}
            securityContext:
              privileged: true
              capabilities:
                add: [ "NET_ADMIN" ]
            livenessProbe:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -q -O /dev/null http://localhost:9999/
              initialDelaySeconds: 30
              periodSeconds: 30
              failureThreshold: 10
              timeoutSeconds: 15
            envFrom:
              - configMapRef:
                  name: gluetun-common-env
            env:
              - name: OPENVPN_USER
                valueFrom:
                  secretKeyRef:
                    name: {{ $.Values.global.vpn.secret }}
                    key: username
              - name: OPENVPN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: {{ $.Values.global.vpn.secret }}
                    key: password
            resources:
              {{- toYaml $.Values.resources.gluetun | nindent 14 }}
            volumeMounts:
              - mountPath: /dev/net/tun
                name: dev-net-tun
              {{- if .portForwardUpdater }}
              - mountPath: /tmp/gluetun
                name: gluetun-port
              {{- end }}
          {{- if .portForwardUpdater }}
          - name: port-updater
            image: alpine:3.20
            resources:
              {{- toYaml $.Values.resources.portUpdater | nindent 14 }}
            command:
              - /bin/sh
              - -c
              - |
                PORT_FILE="/tmp/gluetun/forwarded_port"
                QBIT="http://localhost:{{ .port }}"
                LAST=""
                echo "Waiting for gluetun port file..."
                while [ ! -f "$PORT_FILE" ]; do sleep 5; done
                echo "Waiting for qBittorrent..."
                until wget -q --spider "$QBIT/api/v2/app/version" 2>/dev/null; do sleep 5; done
                while true; do
                  PORT=$(cat "$PORT_FILE" 2>/dev/null)
                  if [ -n "$PORT" ] && [ "$PORT" != "$LAST" ]; then
                    wget -q -O /dev/null --post-data "json={\"listen_port\":$PORT}" \
                      "$QBIT/api/v2/app/setPreferences" && \
                      echo "Updated qBittorrent listen port to $PORT" && \
                      LAST="$PORT"
                  fi
                  sleep 60
                done
            volumeMounts:
              - mountPath: /tmp/gluetun
                name: gluetun-port
          {{- end }}
          - name: {{ .name }}
            image: "{{ $.Values.global.media.imageRepo }}/{{ .name }}:{{ .imageTag | default "latest" }}"
            ports:
              - containerPort: {{ .port }}
            envFrom:
              - configMapRef:
                  name: media-common-env
            resources:
              {{- toYaml $.Values.resources.media | nindent 14 }}
            startupProbe:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -q -O /dev/null http://localhost:{{ .port }}/
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 60
              timeoutSeconds: 5
            livenessProbe:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -q -O /dev/null http://localhost:{{ .port }}/
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
            readinessProbe:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -q -O /dev/null http://localhost:{{ .port }}/
              periodSeconds: 20
              timeoutSeconds: 10
              failureThreshold: 5
            volumeMounts:
              - name: {{ .name }}-config
                mountPath: {{ .configMountPath | default "/config" }}
              {{- if .needsDownloads }}
              - name: downloads
                mountPath: /downloads
              {{- end }}
              {{- if .incompleteHostPath }}
              - name: incomplete
                mountPath: /incomplete
              {{- end }}
              {{- if .finishedHostPath }}
              - name: finished
                mountPath: /finished
              {{- end }}
              {{- if .needsMovies }}
              - name: movies
                mountPath: /movies
              {{- end }}
              {{- if .needsTv }}
              - name: tv
                mountPath: /tv
              {{- end }}
              {{- if .needsBarnfilmer }}
              - name: barnfilmer
                mountPath: /barnfilmer
              {{- end }}
              {{- if .needsTvshows }}
              - name: tvshows
                mountPath: /tvshows
              {{- end }}
              {{- if .needsBarnserier }}
              - name: barnserier
                mountPath: /barnserier
              {{- end }}
        volumes:
          - name: {{ .name }}-config
            hostPath:
              {{- if .configHostPath }}
              path: {{ .configHostPath }}
              {{- else }}
              path: {{ $.Values.global.media.basePath }}/{{ .name }}
              {{- end }}
          - name: dev-net-tun
            hostPath:
              path: /dev/net/tun
          {{- if .portForwardUpdater }}
          - name: gluetun-port
            emptyDir: {}
          {{- end }}
          {{- if .needsDownloads }}
          - name: downloads
            hostPath:
              {{- if .downloadsHostPath }}
              path: {{ .downloadsHostPath }}
              {{- else }}
              path: {{ $.Values.global.media.volumes.downloads }}
              {{- end }}
          {{- end }}
          {{- if .incompleteHostPath }}
          - name: incomplete
            hostPath:
              path: {{ .incompleteHostPath }}
          {{- end }}
          {{- if .finishedHostPath }}
          - name: finished
            hostPath:
              path: {{ .finishedHostPath }}
          {{- end }}
          {{- if .needsMovies }}
          - name: movies
            hostPath:
              path: {{ $.Values.global.media.volumes.movies }}
          {{- end }}
          {{- if .needsTv }}
          - name: tv
            hostPath:
              path: {{ $.Values.global.media.volumes.tv }}
          {{- end }}
          {{- if .needsBarnfilmer }}
          - name: barnfilmer
            hostPath:
              path: {{ $.Values.global.media.volumes.barnfilmer }}
          {{- end }}
          {{- if .needsTvshows }}
          - name: tvshows
            hostPath:
              path: {{ $.Values.global.media.volumes.tvshows }}
          {{- end }}
          {{- if .needsBarnserier }}
          - name: barnserier
            hostPath:
              path: {{ $.Values.global.media.volumes.barnserier }}
          {{- end }}
      {{- end }}
{{- end }}
