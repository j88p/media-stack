# cert-manager self-signed CA and shared internal certificate for local .lan hosts
# Namespace must match your chart namespace (default: plex)
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: plex
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: media-ca
  namespace: plex
spec:
  isCA: true
  commonName: media-ca
  secretName: media-ca-root
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: media-ca-issuer
  namespace: plex
spec:
  ca:
    secretName: media-ca-root
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: media-stack-certificate
  namespace: plex
spec:
  secretName: media-stack-tls
  issuerRef:
    name: media-ca-issuer
    kind: Issuer
  commonName: media.lan
  dnsNames:
    - qbit.lan
    - son.lan
    - rad.lan
    - pro.lan
    - ovr.lan
    - plex.lan
