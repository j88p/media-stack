global:
  namespace: plex
  tz: Europe/Stockholm
  puid: "1000"
  pgid: "1000"
  ingressClass: nginx
  vpn:
    provider: private internet access
    type: openvpn
    region: "Netherlands"
    dns: 10.152.183.10
    outboundSubnets: "10.1.0.0/16,10.152.183.0/24,192.168.0.0/16,10.244.0.0/16"
    image: qmcgaw/gluetun:v3.41.3
    secret: pia-credentials
    openvpnEndpointPort: "1197"
    openvpnProtocol: udp
  media:
    imageRepo: linuxserver
    basePath: /opt/docker_volumes
    volumes:
      downloads: /media/downloads
      movies: /media/movies
      tv: /media/tv
      music: /media/music
      barnfilmer: /mnt/plexpool/barnfilmer
      tvshows: /mnt/plexpool/tvshows
      barnserier: /mnt/plexpool/barnserier

# Resource limits for containers
resources:
  gluetun:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  media:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  plex:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  portUpdater:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "32Mi"
      cpu: "50m"

apps:
  - name: qbittorrent
    port: 8080
    imageTag: "5.2.4_v2.0.15-ls481"
    needsDownloads: true
    portForwardUpdater: true
    ingressHost: qbit.lan
    configHostPath: /opt/docker_volumes/qbittorrent/config
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished
  - name: sonarr
    port: 8989
    imageTag: "4.0.20.3014-ls329"
    needsDownloads: true
    needsTv: true
    needsTvshows: true
    needsBarnserier: true
    ingressHost: son.lan
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished
  - name: radarr
    port: 7878
    imageTag: "6.4.4.10685-ls321"
    needsDownloads: true
    needsMovies: true
    needsBarnfilmer: true
    ingressHost: rad.lan
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished
  - name: prowlarr
    port: 9696
    imageTag: "2.6.5.5623-ls163"
    needsDownloads: false
    ingressHost: pro.lan

  - name: seerr
    port: 5055
    imageTag: "3.5.0"
    noVpn: true
    imageRepo: seerr
    configMountPath: /app/config
    configHostPath: /opt/docker_volumes/seerr
    ingressHost: seerr.lan

  - name: plex
    port: 32400
    imageTag: "1.43.4.10903-e5521bd8c-ls327"
    serviceType: ClusterIP
    ingressHost: plex.lan
    hostNetwork: true
    needsConfig: true
    needsTranscode: true
    needsMovies: true
    needsBarnfilmer: true
    needsTvshows: true
    needsBarnserier: true
    env:
      VERSION: docker
      ADVERTISE_IP: "https://plex.houseslab.org,http://192.168.1.128:32400"
    securityContext:
      privileged: true
      runAsUser: 1000
      runAsGroup: 1000
    volumes:
      config: /opt/docker_volumes/plex/config
      transcode: /opt/docker_volumes/plex/transcode
      movies: /mnt/plexpool/movies
      barnfilmer: /mnt/plexpool/barnfilmer
      tvshows: /mnt/plexpool/tvshows
      barnserier: /mnt/plexpool/barnserier
