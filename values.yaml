global:
  namespace: plex
  tz: Europe/Stockholm
  puid: "1000"
  pgid: "1000"

  # Routing — "gateway" uses Gateway API (HTTPRoute), "ingress" uses standard Ingress
  routing:
    type: gateway                 # "gateway" (Gateway API) or "ingress" (standard Ingress)
    gateway:
      name: nginx-gateway         # name of your Gateway resource
      namespace: nginx-gateway    # namespace it lives in
      section: https-listener     # listener section name
    ingressClass: nginx           # used when type is "ingress"

  vpn:
    provider: private internet access   # any gluetun-supported provider
    type: openvpn                        # openvpn or wireguard
    region: "Netherlands"
    dns: 10.96.0.10                      # cluster DNS (kubectl get svc kube-dns -n kube-system)
    outboundSubnets: "10.96.0.0/12,192.168.0.0/16"   # cluster CIDR + LAN — keep VPN traffic local
    image: qmcgaw/gluetun:v3.41.3
    secret: pia-credentials
    openvpnEndpointPort: "1197"
    openvpnProtocol: udp

  media:
    imageRepo: linuxserver
    basePath: /opt/docker_volumes
    volumes:
      downloads: /media/downloads
      movies: /mnt/plexpool/movies
      tv: /media/tv
      music: /media/music
      tvshows: /mnt/plexpool/tvshows

# Resource limits for containers
resources:
  gluetun:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  media:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  plex:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  portUpdater:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "32Mi"
      cpu: "50m"

apps:
  - name: qbittorrent
    port: 8080
    imageTag: "5.2.4_v2.0.15-ls481"
    needsDownloads: true
    portForwardUpdater: true
    ingressHost: qbit.yourdomain.com
    configHostPath: /opt/docker_volumes/qbittorrent/config
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished

  - name: sonarr
    port: 8989
    imageTag: "4.0.20.3014-ls329"
    needsDownloads: true
    needsTv: true
    needsTvshows: true
    ingressHost: son.yourdomain.com
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished
    extraVolumeMounts:
      - name: barnserier
        mountPath: /barnserier
        hostPath: /mnt/plexpool/barnserier

  - name: radarr
    port: 7878
    imageTag: "6.4.4.10685-ls321"
    needsDownloads: true
    needsMovies: true
    ingressHost: rad.yourdomain.com
    downloadsHostPath: /mnt/plexpool/newDownloads
    incompleteHostPath: /mnt/plexpool/incomplete
    finishedHostPath: /mnt/plexpool/finished
    extraVolumeMounts:
      - name: barnfilmer
        mountPath: /barnfilmer
        hostPath: /mnt/plexpool/barnfilmer

  - name: prowlarr
    port: 9696
    imageTag: "2.6.5.5623-ls163"
    needsDownloads: false
    ingressHost: pro.yourdomain.com

  - name: seerr
    port: 5055
    imageTag: "v3.5.0"
    noVpn: true
    imageRepo: seerr
    configMountPath: /app/config
    configHostPath: /opt/docker_volumes/seerr
    ingressHost: seerr.yourdomain.com

  - name: plex
    port: 32400
    imageTag: "1.43.4.10903-e5521bd8c-ls327"
    serviceType: ClusterIP
    ingressHost: plex.yourdomain.com
    hostNetwork: true
    # Set true to pass an NVIDIA GPU through for hardware transcoding (needs the microk8s nvidia addon)
    nvidiaGpu: false
    env:
      ADVERTISE_IP: "https://plex.yourdomain.com,http://192.168.x.x:32400"
    securityContext:
      privileged: true
      runAsUser: 1000
      runAsGroup: 1000
    volumes:
      config: /opt/docker_volumes/plex/config
      transcode: /opt/docker_volumes/plex/transcode
      movies: /mnt/plexpool/movies
      tvshows: /mnt/plexpool/tvshows
    extraVolumeMounts:
      - name: barnfilmer
        mountPath: /barnfilmer
        hostPath: /mnt/plexpool/barnfilmer
      - name: barnserier
        mountPath: /barnserier
        hostPath: /mnt/plexpool/barnserier
